  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body style="margin: 0; padding: 0; background-color: #0A1222; overflow: hidden;">
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <div id="flutter_splash" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0A1222; z-index: 999999; font-family: sans-serif;">
    <div style="width: 44px; height: 44px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: #6366F1; border-radius: 50%; animation: martSpin 0.9s linear infinite;"></div>
    <div style="margin-top: 16px; color: #94A3B8; font-size: 13px; font-weight: 500; letter-spacing: 0.5px;">Mart POS Loading...</div>
  </div>
  <style>
    @keyframes martSpin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Remove splash once flutter-view mounts
    (function monitorSplash() {
      const splash = document.getElementById('flutter_splash');
      if (!splash) return;
      const interval = setInterval(() => {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          splash.style.transition = 'opacity 0.25s ease';
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 250);
          clearInterval(interval);
        }
      }, 100);
      setTimeout(() => { if (splash) splash.remove(); }, 15000);
    })();

    // Auto-run fallback for Flutter Web in debug mode (DDC)
    // When the browser is refreshed (F5/Ctrl+R), DWDS may not automatically invoke $dartRunMain.
    (function autoRunFlutter() {
      let launched = false;
      function checkAndRun() {
        if (launched) return;
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          launched = true;
          return;
        }
        if (typeof window.$dartRunMain === 'function') {
          console.log('[AutoRun] Launching Flutter app via $dartRunMain...');
          launched = true;
          try {
            window.$dartRunMain();
          } catch (e) {
            console.error('[AutoRun] Error executing $dartRunMain:', e);
          }
        }
      }
      const interval = setInterval(checkAndRun, 200);
      window.addEventListener('load', checkAndRun);
      setTimeout(() => clearInterval(interval), 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async=""></script>
